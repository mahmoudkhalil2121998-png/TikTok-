<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Post analysis</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f5f5f5;--card:#fff;--tx:#111;--mut:#7a7a7a;--line:#e0e0e0;--blue:#0074e0;--blue2:#7dbbf0;--sel:#f6faff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--card:#1e1e1e;--tx:#f2f2f2;--mut:#9a9a9a;--line:#333;--sel:#142233}}
:root[data-theme="dark"]{--bg:#121212;--card:#1e1e1e;--tx:#f2f2f2;--mut:#9a9a9a;--line:#333;--sel:#142233}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:560px;margin:0 auto;padding-bottom:40px}
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 16px;height:56px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:8}
h1{font-size:19px;margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.edit{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:5px 10px;font-weight:600;font-size:12px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;justify-self:end}.edit svg{width:14px;height:14px;fill:currentColor}.bk{padding:4px;justify-self:start;line-height:0}.bk svg{width:26px;height:26px;fill:currentColor}
.posted{text-align:center;color:var(--mut);font-size:14px;margin:6px 0 14px}
.top{display:flex;justify-content:space-around;padding:0 6px 14px}
.top div{text-align:center;flex:1;border-left:1px solid var(--line)}
.top div:first-child{border:0}

.top b{display:block;font-size:20px;margin-top:4px}

.tabs button.on{color:var(--tx);font-weight:700;border-color:var(--tx)}
.card{background:var(--card);border-radius:14px;margin:12px;padding:18px}
.card h2{font-size:21px;margin:0 0 4px}
.sub{color:var(--mut);font-size:14px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.m{border:1px solid var(--line);border-radius:10px;padding:14px}
.m.sel{border-color:var(--blue);background:var(--sel)}
.m span{font-size:15px}.m b{display:block;font-size:26px;margin-top:6px}
.row{display:flex;justify-content:space-between;margin:14px 0 6px;font-size:16px}
.row b{font-weight:600}
.bar{height:9px;background:var(--line);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:5px}
.two{display:flex;justify-content:space-between;font-size:16px;margin-top:6px}
.big{font-size:32px;font-weight:700}
svg.chart{width:100%;height:auto;margin-top:12px;overflow:visible}
.gl{stroke:var(--line);stroke-dasharray:4 4}
.lbl{fill:var(--mut);font-size:11px}
.leg{display:flex;justify-content:center;gap:18px;color:var(--mut);font-size:14px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.empty{color:var(--mut);font-size:15px;margin:0}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input,textarea{width:100%;font:inherit;font-size:16px;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
textarea{min-height:110px;resize:vertical}
.act{display:flex;gap:10px;margin:16px 12px}
.act button{flex:1;padding:13px;border-radius:10px;font-weight:700}
.save{background:var(--blue);color:#fff}.cancel{border:1px solid var(--line);background:var(--card)}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.thumbs.view{padding:0 16px 8px}.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block}.th{position:relative;aspect-ratio:1;border:1px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:26px;overflow:hidden}.th img{position:absolute;inset:0;height:100%}.th input{position:absolute;inset:0;opacity:0;cursor:pointer;padding:0;width:100%;height:100%}.th button{position:absolute;left:0;right:0;bottom:0;z-index:2;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:5px}
.lr{cursor:pointer}.row b{display:inline-flex;align-items:center}.chv{width:16px;height:16px;stroke:var(--tx);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;margin-left:4px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sh{width:100%;max-width:560px;background:var(--card);border-radius:20px 20px 0 0;max-height:75vh;overflow:auto;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.shh{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}
.shh b{font-size:19px}.shh button{justify-self:end;line-height:0;padding:4px}.shh svg{width:26px;height:26px;stroke:var(--tx);fill:none;stroke-width:2.2;stroke-linecap:round}
.shb{padding:4px 18px 0}
.rs{-webkit-appearance:none;appearance:none;display:block;width:calc(86.47% + 26px);margin:4px 0 0 calc(1.76% - 13px);height:8px;padding:0;border:0;border-radius:4px;background:var(--line);outline:none}
.rs::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:0;box-shadow:0 1px 6px rgba(0,0,0,.4)}
.rs::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:0;box-shadow:0 1px 6px rgba(0,0,0,.4)}
.rimg{display:block;width:150px;max-width:60%;height:auto;max-height:270px;object-fit:cover;border-radius:8px;margin:20px auto 6px}
.inf{width:17px;height:17px;margin-left:8px;vertical-align:-2px;color:var(--tx);opacity:.8;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}
</style>
</head>
<body>

traffic:"For You: 54.1\nPersonal profile: 36.0\nOther: 7.8\nFollowing: 2.1\nSearch: 0\nDirect messages: 0\nSound: 0",

retText:"Most viewers left after 2 photos. Use the graph to view more insights and understand viewers' behaviors.",retSeries:"100, 23, 10, 3"};
var SCHEMA=[
{h:"Post",f:[["posted","Posted on","t"],["views","Plays (top row)","n"],["likes","Likes","n"],["comments","Comments","n"],["shares","Shares","n"],["saves","Saves","n"]]},
{h:"Overview",f:[["postViews","Post views","n"],["photos","Photos viewed","t"],["playTime","Total play time","t"],["newFollowers","New followers","n"],["series","Views over time: numbers separated by commas","t"],["hours","Hours on the chart (x-axis end)","n"]]},

function topRow(){var P={v:"M8 5v14l11-7z",l:"M12 21l-1.4-1.3C5.4 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.8-3.4 6.9-8.6 11.200z",c:"M4 3h16a2 2 0 012 2v11a2 2 0 01-2 2H8l-5 4V5a2 2 0 011-2z",s:"M14 9V4l8 8-8 8v-5c-6 0-10 2-12 6 1-7 5-12 12-12z",b:"M6 3h12v18l-6-4-6 4z"};

function pair(a,b,l1,l2){return'<div class="row"><b>'+a+'%</b><b>'+b+'%</b></div><div class="bar"><i style="width:'+a+'%"></i></div><div class="two"><span>'+l1+'</span><span>'+l2+'</span></div>'}
function gender(){var m=Math.max(0,+d.male||0),f=Math.max(0,+d.female||0),t=(m+f)||1,mp=m/t*100;
return'<svg viewBox="0 0 200 110" style="width:70%;display:block;margin:10px auto 6px"><path d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="var(--blue2)" stroke-width="30"/><path d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="var(--blue)" stroke-width="30" pathLength="100" stroke-dasharray="'+mp+' 100"/></svg><div class="leg"><span><i style="background:var(--blue)"></i>Male '+Math.round(mp)+'%</span><span><i style="background:var(--blue2)"></i>Female '+Math.round(100-mp)+'%</span></div>'}
function views(){
if(tab==="Inspiration"){var it=String(d.insp).split("\n").filter(function(l){return l.trim()}).map(function(l){var i=l.indexOf(":");return i<0?[l.trim(),""]:[l.slice(0,i).trim(),l.slice(i+1).trim()]});return'<div class="card"><h2>Inspiration</h2>'+(it.length?it.map(function(x){return'<div class="m" style="margin-top:10px"><b style="font-size:17px;margin:0">'+esc(x[0])+'</b>'+(x[1]?'<span style="color:var(--mut)">'+esc(x[1])+'</span>':'')+'</div>'}).join(""):'<p class="empty">No ideas yet. Tap Edit data to add some.</p>')+'</div>'}
if(tab==="Overview")return'<div class="card"><h2>Key metrics</h2><p class="sub">Updated in real time.</p><div class="grid"><div class="m sel"><span>Post views</span><b>'+fmt(d.postViews,1)+'</b></div><div class="m"><span>Photos viewed</span><b>'+esc(d.photos)+'</b></div><div class="m"><span>Total play time</span><b style="font-size:23px">'+esc(d.playTime)+'</b></div><div class="m"><span>New followers</span><b>'+(+d.newFollowers||0)+'</b></div></div>'+chart()+'</div>'+retention("ret")+'<div class="card"><h2>Traffic sources</h2>'+bars(d.traffic,"%",false)+'</div><div class="card"><h2>Search queries</h2>'+sq()+'</div>';
if(tab==="Viewers")return'<div class="card"><h2>Total viewers</h2><div class="big">'+esc(d.totalViewers)+'</div></div><div class="card"><h2>Viewer types</h2>'+pair(+d.newPct||0,100-(+d.newPct||0),"New viewers","Returning viewers")+'<div style="height:18px"></div>'+pair(+d.nonFolPct||0,100-(+d.nonFolPct||0),"Non-followers","Followers")+'</div><div class="card"><h2>Gender</h2>'+gender()+'</div><div class="card"><h2>Age</h2>'+bars(d.age,"%",false)+'</div><div class="card"><h2>Locations</h2>'+locBars()+'</div>';
return'<div class="card"><h2>Top words used in comments</h2>'+(parse(d.words).length?bars(d.words,"",true):'<p class="empty">No comment words yet. Tap Edit data to add them.</p>')+'</div>'+retention("likes")}
function form(){return thumbForm()+SCHEMA.map(function(s){return'<div class="card"><h2>'+s.h+'</h2>'+s.f.map(function(f){var v=esc(d[f[0]]);return'<label for="f-'+f[0]+'">'+f[1]+'</label>'+(f[2]==="l"?'<textarea id="f-'+f[0]+'">'+v+'</textarea>':'<input id="f-'+f[0]+'" value="'+v+'"'+(f[2]==="n"?' inputmode="decimal"':'')+'>')}).join("")+'</div>'}).join("")+'<div class="act"><button class="cancel" id="cx">Cancel</button><button class="save" id="sv">Save changes</button></div>'}
function render(){closeSheet();
if(editing){eb.style.display="none";app.innerHTML=form();
document.getElementById("cx").onclick=function(){editing=false;render()};
Array.prototype.forEach.call(app.querySelectorAll(".th input"),function(inp){inp.onchange=function(){var f=inp.files[0];if(!f)return;shrink(f,function(u){collect();d.thumbs=(d.thumbs||["","","",""]).slice();d.thumbs[+inp.dataset.i]=u;save();render()})}});
Array.prototype.forEach.call(app.querySelectorAll(".th button"),function(b){b.onclick=function(){collect();d.thumbs=d.thumbs.slice();d.thumbs[+b.dataset.x]="";save();render()}});
document.getElementById("sv").onclick=function(){SCHEMA.forEach(function(s){s.f.forEach(function(f){var v=document.getElementById("f-"+f[0]).value;d[f[0]]=f[2]==="n"?(parseFloat(v)||0):v})});save();editing=false;render();window.scrollTo(0,0)};return}
eb.style.display="";
app.innerHTML=thumbs()+'<div class="posted">Posted on '+esc(d.posted)+'</div>'+topRow()+'<div class="tabs">'+["Inspiration","Overview","Viewers","Engagement"].map(function(t){return'<button data-t="'+t+'" class="'+(t===tab?"on":"")+'">'+t+'</button>'}).join("")+'</div>'+addInfo(views());
Array.prototype.forEach.call(app.querySelectorAll(".tabs button"),function(b){b.onclick=function(){tab=b.dataset.t;render()}});
Array.prototype.forEach.call(app.querySelectorAll(".lr"),function(b){b.onclick=function(){openSheet(+b.dataset.c)}});
["ret","likes"].forEach(function(c){var rs=document.getElementById("rs-"+c);if(rs)rs.oninput=function(){RC[c].sel=+rs.value;retUpdate(c)}})}
eb.onclick=function(){editing=true;render();window.scrollTo(0,0)};
document.getElementById("bk").onclick=function(){if(document.getElementById("ov")){closeSheet();return}if(editing){editing=false;render()}else{history.back()}};
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
</script>
</body>
</html>
